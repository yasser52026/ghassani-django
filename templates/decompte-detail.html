{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Décompte — CHR de Fès</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="app-layout">
    <div id="sidebar-container"></div>
    <main class="contenu-principal">
        <div class="page-header">
            <div>
                <h2 id="titreService">Décompte</h2>
                <p id="sousTitre"></p>
                <div style="margin-top:0.5rem;display:flex;gap:0.5rem;">
                    <button type="button" class="btn btn-sm btn-outline-light" id="ongletGarde" onclick="changerType('garde')">Garde</button>
                    <button type="button" class="btn btn-sm btn-outline-light" id="ongletPermanence" onclick="changerType('permanence')">Permanence</button>
                    <button type="button" class="btn btn-sm btn-outline-light" id="ongletAstreinte" onclick="changerType('astreinte')">Astreinte</button>
                </div>
            </div>
            <div class="page-header-actions">
                <button id="boutonExcel" class="btn btn-outline-light" onclick="telechargerExport('excel')">Export Excel</button>
                <button id="boutonPdf" class="btn btn-outline-light" onclick="telechargerExport('pdf')">Bordereau PDF</button>
                <button id="boutonValider" class="btn btn-light" style="display:none;" onclick="validerDecompte()">Valider</button>
            </div>
        </div>
        <div class="card p-3">
            <table>
                <thead id="enteteTable"></thead>
                <tbody id="corpsDecompte"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="{% static 'js/api.js' %}?v=2"></script>
<script src="{% static 'js/layout.js' %}?v=2"></script>
<script>
const params = new URLSearchParams(window.location.search);
const serviceId = params.get('service_id');
const annee = params.get('annee');
const mois = params.get('mois');
const TYPES_VALIDES = ['garde', 'permanence', 'astreinte'];
let typeActivite = TYPES_VALIDES.includes(params.get('type')) ? params.get('type') : 'garde';

function changerType(type) {
    window.location.href = `/decompte-detail.html?service_id=${serviceId}&annee=${annee}&mois=${mois}&type=${type}`;
}

function majOnglets() {
    document.getElementById('ongletGarde').className = typeActivite === 'garde' ? 'btn btn-sm btn-light' : 'btn btn-sm btn-outline-light';
    document.getElementById('ongletPermanence').className = typeActivite === 'permanence' ? 'btn btn-sm btn-light' : 'btn btn-sm btn-outline-light';
    document.getElementById('ongletAstreinte').className = typeActivite === 'astreinte' ? 'btn btn-sm btn-light' : 'btn btn-sm btn-outline-light';
}

async function chargerDecompte() {
    majOnglets();
    const estPermanence = typeActivite === 'permanence';
    const estAstreinte = typeActivite === 'astreinte';
    const libelleType = estAstreinte ? 'Astreinte' : (estPermanence ? 'Permanence' : 'Garde');

    const service = await apiJSON(`/services/${serviceId}/`);
    document.getElementById('titreService').textContent = `Décompte de ${libelleType.toLowerCase()} — ${service.nom}`;
    document.getElementById('sousTitre').textContent = `${mois}/${annee}`;

    if (estAstreinte) {
        document.getElementById('enteteTable').innerHTML = `
            <tr><th>Matricule</th><th>Nom et prénom</th><th>Ouvrable</th><th>Week-end/férié</th><th>Unités</th><th>Statut</th></tr>
        `;
    } else if (estPermanence) {
        document.getElementById('enteteTable').innerHTML = `
            <tr><th>Matricule</th><th>Nom et prénom</th><th>Ouvrable</th><th>Férié</th><th>Total</th><th>Statut</th></tr>
        `;
    } else {
        document.getElementById('enteteTable').innerHTML = `
            <tr><th>Matricule</th><th>Nom et prénom</th><th>Ouvrable</th><th>Vendredi</th><th>Ramadan</th><th>Week-end/férié</th><th>Nuit</th><th>Total</th><th>Statut</th></tr>
        `;
    }

    const data = await apiJSON(`/decomptes/${serviceId}/${annee}/${mois}/?type=${typeActivite}`);
    if (data.decomptes.length) {
        console.log('Exemple de ligne reçue pour type=' + typeActivite + ' :', data.decomptes[0]);
    }
    const corps = document.getElementById('corpsDecompte');
    const nbColonnes = estAstreinte || estPermanence ? 6 : 9;
    if (!data.decomptes.length) {
        corps.innerHTML = `<tr><td colspan="${nbColonnes}" style="text-align:center;color:var(--gris-texte);">Aucun décompte calculé. Ouvrez le planning et cliquez sur « Calculer ».</td></tr>`;
    } else if (estAstreinte) {
        corps.innerHTML = data.decomptes.map(d => {
            const unites = d.unites ?? d.nb_unites ?? d.total_unites ?? d.total_heures ?? 0;
            return `
            <tr>
                <td>${d.agent_matricule}</td><td>${d.agent_nom}</td>
                <td>${d.heures_ouvrable ?? 0} h</td><td>${d.heures_weekend_ferie ?? 0} h</td>
                <td><strong>${unites}</strong></td><td><span class="badge">${d.statut_validation}</span></td>
            </tr>`;
        }).join('');
    } else if (estPermanence) {
        corps.innerHTML = data.decomptes.map(d => `
            <tr>
                <td>${d.agent_matricule}</td><td>${d.agent_nom}</td>
                <td>${d.heures_ouvrable} h</td><td>${d.heures_weekend_ferie} h</td>
                <td><strong>${d.total_heures} h</strong></td><td><span class="badge">${d.statut_validation}</span></td>
            </tr>
        `).join('');
    } else {
        corps.innerHTML = data.decomptes.map(d => `
            <tr>
                <td>${d.agent_matricule}</td><td>${d.agent_nom}</td>
                <td>${d.heures_ouvrable} h</td><td>${d.heures_vendredi} h</td><td>${d.heures_ramadan} h</td>
                <td>${d.heures_weekend_ferie} h</td><td>${d.heures_nuit} h</td>
                <td><strong>${d.total_heures} h</strong></td><td><span class="badge">${d.statut_validation}</span></td>
            </tr>
        `).join('');
    }
}

async function telechargerExport(type) {
    const reponse = await api(`/decomptes/${serviceId}/${annee}/${mois}/export/${type}/?type=${typeActivite}`);
    const blob = await reponse.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = type === 'excel' ? `decompte_${typeActivite}_${annee}_${mois}.xlsx` : `bordereau_${typeActivite}_${annee}_${mois}.pdf`;
    a.click();
    window.URL.revokeObjectURL(url);
}

async function validerDecompte() {
    await apiJSON(`/decomptes/${serviceId}/${annee}/${mois}/valider/?type=${typeActivite}`, { method: 'POST' });
    chargerDecompte();
}

(async () => {
    const utilisateur = await chargerLayout('decomptes');
    if (!utilisateur) return;

    console.log('Rôle détecté pour ce compte :', utilisateur.role);

    const rolesAutorises = ['chef_service', 'directeur', 'administrateur'];
    const roleNormalise = (utilisateur.role || '').toString().trim().toLowerCase();
    if (rolesAutorises.includes(roleNormalise)) {
        document.getElementById('boutonValider').style.display = 'inline-block';
    }

    chargerDecompte();
})();
</script>
</body>
</html>
