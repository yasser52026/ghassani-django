{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription — CHR de Fès</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="page-connexion">
    <div class="panneau-image">
        <svg class="emblem-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="16" fill="rgba(255,255,255,0.12)"/>
            <path d="M32 14V50M14 32H50" stroke="white" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <h1>Centre Hospitalier<br>Régional de Fès</h1>
        <p>Plateforme de gestion des gardes et des heures supplémentaires — Hôpital Al Ghassani.</p>
    </div>
    <div class="panneau-formulaire">
        <div class="carte-connexion" style="max-width:520px;">
            <h4 class="mb-3">Demande de compte</h4>
            <p style="color:var(--gris-texte);font-size:0.85rem;margin-bottom:1rem;">Votre compte sera activé après validation par le service RH.</p>
            <div id="erreur" class="alert alert-danger" style="display:none;"></div>
            <div id="succes" class="alert alert-success" style="display:none;"></div>
            <form id="formInscription">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="mb-3"><label class="form-label">Matricule</label><input type="text" id="matricule" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Nom</label><input type="text" id="nom" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Prénom</label><input type="text" id="prenom" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Fonction</label><input type="text" id="fonction" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">CIN</label><input type="text" id="cin" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Téléphone</label><input type="text" id="telephone" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">RIB</label><input type="text" id="rib" class="form-control"></div>
                </div>
                <div class="mb-3"><label class="form-label">Mot de passe</label><input type="password" id="motDePasse" class="form-control" required></div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-bottom:0.5rem;">Envoyer la demande</button>
                <a href="/connexion.html" style="display:block;text-align:center;font-size:0.9rem;">J'ai déjà un compte</a>
            </form>
        </div>
    </div>
</div>
<script>
document.getElementById('formInscription').addEventListener('submit', async (e) => {
    e.preventDefault();
    const erreurDiv = document.getElementById('erreur');
    const succesDiv = document.getElementById('succes');
    erreurDiv.style.display = 'none';
    succesDiv.style.display = 'none';

    const corps = {
        matricule: document.getElementById('matricule').value,
        email: document.getElementById('email').value,
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        fonction: document.getElementById('fonction').value,
        cin: document.getElementById('cin').value,
        telephone: document.getElementById('telephone').value,
        rib: document.getElementById('rib').value,
        mot_de_passe: document.getElementById('motDePasse').value,
    };

    try {
        const reponse = await fetch('http://127.0.0.1:8000/api/comptes/inscription/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(corps),
        });
        const data = await reponse.json();
        if (!reponse.ok) throw new Error(data.detail || 'Erreur');
        succesDiv.textContent = 'Demande envoyée. Un membre du service RH doit valider votre compte avant que vous puissiez vous connecter.';
        succesDiv.style.display = 'block';
        e.target.reset();
    } catch (err) {
        erreurDiv.textContent = err.message;
        erreurDiv.style.display = 'block';
    }
});
</script>
</body>
</html>
